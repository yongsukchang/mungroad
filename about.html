<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>소개 | 멍로드</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="wrap nav"><a class="brand" href="index.html">멍<span>로드</span></a></div></header><main class="article"><p class="eyebrow">ABOUT</p><h1>멍로드는 왜 만들었나요?</h1><p class="lead">반려견과 이동할 때 가장 답답한 건 “그래서 실제로 탈 수 있나?”라는 질문에 답이 흩어져 있다는 점입니다.</p><p>멍로드는 반려견과 대중교통, 자동차, 카페, 숙소를 이용할 때 필요한 정보를 문제 해결형으로 정리합니다. 바뀔 수 있는 규정은 가능한 한 공식 출처와 확인일을 함께 기록하고, 경험에 따라 달라지는 내용은 규정과 구분해서 설명합니다.</p><p>이 사이트는 초기 시제품입니다. 실제 경험 사진, 이동장 실측, 노선별 확인 기록 등을 추가해 독자적인 정보를 쌓는 것을 목표로 합니다.</p></main></body></html>
